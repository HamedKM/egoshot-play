<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EgoShot Test</title>
<style>
html,body{margin:0;height:100%;background:#0b1118;color:#F5F3EE;font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;text-align:center}
.logo{font:900 40px Impact,'Arial Black',sans-serif;letter-spacing:.5px}.logo b{color:#FF6A00}.logo small{font:600 13px system-ui;color:#24D7FF;display:block;letter-spacing:2px}
#msg{color:#cdd6df;min-height:22px}.bar{width:min(420px,80vw);height:10px;background:#1c2733;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#FF6A00;transition:width .2s}
.bar.ind i{width:35%;animation:sl 1.1s infinite ease-in-out}@keyframes sl{0%{margin-left:-35%}100%{margin-left:100%}}
button{font:700 17px system-ui;padding:12px 20px;border-radius:12px;border:2px solid #3b4f63;background:#1c2733;color:#fff;margin:4px}button.go{background:#22c55e;border-color:#22c55e;color:#04140a}
button.ghost{border-color:transparent;background:none;color:#9CA8B4;font-size:14px}#box{display:none;max-width:520px}#box p{margin:6px 0;color:#dfe6ee}small.v{color:#6b7885;font-size:12px}
</style></head><body><div id="w">
<div class="logo">EGO<b>SHOT</b><small>VERSION DE TEST</small></div>
<div id="msg">Recherche de mise à jour…</div><div class="bar ind" id="bar"><i id="fill"></i></div>
<div id="box"></div>
<button class="ghost" id="skip" style="visibility:hidden">Passer</button>
<small class="v" id="ver"></small>
</div><script>
var N=window.EgoShotTest,t0=Date.now(),last='',lastChange=Date.now(),shown='';
function $(i){return document.getElementById(i)}
function act(a){try{N.act(a)}catch(e){}}
function box(html){if(shown===html)return;shown=html;$('box').innerHTML=html;$('box').style.display=html?'block':'none';$('bar').style.display=html?'none':'block';$('msg').style.display=html?'none':'block'}
function tick(){
  var s={};try{s=JSON.parse(N.boot())}catch(e){}
  var key=s.phase+'|'+s.pct; if(key!==last){last=key;lastChange=Date.now()}
  $('ver').textContent=s.mine?'appli '+s.mine:'';
  if(s.phase==='apk'){box('<p><b>Mise à jour disponible</b></p><p>Une nouvelle version de l’application'+(s.apk?' ('+s.apk+')':'')+' est prête. Ton compte et tes données sont conservés.</p><button class="go" onclick="act(\'install\')">Mettre à jour</button><button onclick="act(\'later\')">Plus tard</button>');$('skip').style.visibility='hidden';return}
  if(s.phase==='apkperm'){box('<p><b>Une autorisation, une seule fois</b></p><p>Android demande d’autoriser « EgoShot Test » à installer des applications. Active l’interrupteur, reviens ici, puis touche « Installer ».</p><button class="go" onclick="act(\'retry\')">Installer</button><button onclick="act(\'skip\')">Plus tard</button>');return}
  if(s.phase==='apkready'){box('<p><b>Mise à jour prête</b></p><p>Touche « Installer » dans la fenêtre d’Android. Si elle ne s’est pas ouverte :</p><button class="go" onclick="act(\'retry\')">Installer</button><button onclick="act(\'skip\')">Plus tard</button>');return}
  if(s.phase==='apkfail'){box('<p><b>Installation impossible</b></p><p>On continue avec la version actuelle.</p><button onclick="act(\'skip\')">Continuer</button>');return}
  box('');
  $('msg').textContent=s.msg||'Recherche de mise à jour…';
  var ind=!(s.pct>=0); $('bar').className='bar'+(ind?' ind':''); if(!ind)$('fill').style.width=s.pct+'%'; else $('fill').style.width='';
  // « Passer » apparaît vite ; sans aucun progrès pendant 25 s, on démarre tout seul avec la version déjà présente
  if(Date.now()-t0>4000)$('skip').style.visibility='visible';
  if(Date.now()-lastChange>25000&&s.phase!=='go'){lastChange=Date.now();act('skip')}
}
$('skip').onclick=function(){act('skip')};
if(N){setInterval(tick,200);tick()}else{$('msg').textContent='Cette page fait partie de l’application EgoShot Test.'}
</script></body></html>
