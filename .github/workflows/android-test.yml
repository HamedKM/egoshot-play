# Construit l'appli Android de TEST (« EgoShot Test ») à partir de la version de test du jeu (dossier test/).
# Elle a son propre identifiant : elle s'installe À CÔTÉ de l'appli normale, sans la remplacer.
# Lien de téléchargement : https://github.com/HamedKM/egoshot-play/releases/download/apk-test/EgoShot-Test.apk
# L'appli normale (android.yml, publication « apk ») n'est pas touchée.
name: APK Android de test
on:
  push:
    branches: [main]
    paths: ['test/index.html', 'test/android/**', '.github/workflows/android-test.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk-test, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copie du projet Android, transformée en appli de test
        run: |
          cp -r android /tmp/android-test
          python3 test/android/patch.py /tmp/android-test
          mkdir -p /tmp/android-test/app/src/main/assets
          cp test/index.html test/jet_cine.glb test/livekit-client.umd.js /tmp/android-test/app/src/main/assets/
      - name: Construction
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
        run: gradle -p /tmp/android-test assembleRelease --no-daemon
      - name: Publication en pré-version (le lien de l'appli normale ne change pas)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp /tmp/android-test/app/build/outputs/apk/release/app-release.apk EgoShot-Test.apk
          gh release delete apk-test --yes --cleanup-tag || true
          gh release create apk-test EgoShot-Test.apk --prerelease --latest=false --title "EgoShot Test pour Android (version ${{ github.run_number }})" --notes "Version de TEST, pour les testeurs. Elle s'installe à côté de l'appli EgoShot normale. Sur ton téléphone Android : télécharge EgoShot-Test.apk puis ouvre-le pour l'installer."
      - uses: actions/upload-artifact@v4
        with: { name: EgoShot-Test-apk, path: EgoShot-Test.apk }
