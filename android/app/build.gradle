plugins { id 'com.android.application' }

def buildNumber = (System.getenv('BUILD_NUMBER') ?: '1').toInteger()

android {
  namespace 'com.minebeatstudios.egoshot'
  compileSdk 34
  defaultConfig {
    applicationId 'com.minebeatstudios.egoshot'
    minSdk 24
    targetSdk 34
    versionCode buildNumber
    versionName "0.2.${buildNumber}"
  }
  // Clé de TEST (la clé « debug » standard d'Android, publique par nature) : toujours la même,
  // pour pouvoir installer les nouvelles versions par-dessus l'ancienne. Le Play Store demandera une vraie clé privée.
  signingConfigs {
    test { storeFile file('test.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.test }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.browser:browser:1.8.0' // fenêtre de navigateur par-dessus l'appli (connexion Google)
}
